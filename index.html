<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="프로젝트와 작업 결과를 모아 소개하는 포트폴리오 아카이브"
    />
    <title>Project Archive</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Portfolio</p>
      <h1>Project Archive</h1>
      <p class="intro">프로젝트와 작업 결과를 한곳에 정리하는 공간입니다.</p>
    </header>

    <main class="project-grid" aria-label="프로젝트 목록">
      <!-- 프로젝트 정보가 확정되면 이 카드를 복사해 내용을 채웁니다. -->
      <article class="project-card">
        <p class="project-status">Coming soon</p>
        <h2>프로젝트 준비 중</h2>
        <p>프로젝트 소개와 결과물을 순차적으로 추가할 예정입니다.</p>
      </article>
    </main>

    <footer>
      <p>Built as a growing archive of work.</p>
    </footer>
  </body>
</html>
